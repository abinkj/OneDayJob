name: Zoopol EAS Builds

on:
  push:
    branches:
      - staging
      - main

jobs:
  # staging → preview builds (ad-hoc for iOS, APK for Android)
  # build_preview_android:
  #  if: ${{ github.ref == 'refs/heads/staging' }}
  #  type: build
  #  params:
  #    platform: android
  #    profile: preview

  build_preview_ios:
    if: ${{ github.ref == 'refs/heads/staging' }}
    type: build
    params:
      platform: ios
      profile: preview

  #ota_staging:
  #  if: ${{ github.ref == 'refs/heads/staging' }}
  #  type: update
  #  needs: [build_preview_android, build_preview_ios]
  #  params:
  #    branch: staging
  #    message: "Staging update from CI"

  # main → production build + OTA update ye
  build_android:
    if: ${{ github.ref == 'refs/heads/main' }}
    type: build
    params:
      platform: android
      profile: production

  build_ios:
    if: ${{ github.ref == 'refs/heads/main' }}
    type: build
    params:
      platform: ios
      profile: production

  ota_production:
    if: ${{ github.ref == 'refs/heads/main' }}
    type: update
    params:
      branch: production
      message: "Production update"